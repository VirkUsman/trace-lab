# promtool test rules rules-tests/slo_test.yml
# One sample per minute. Kept out of rules/ because compose mounts that folder
# into Prometheus, which would try to load this file as rules.
rule_files:
  - ../rules/slo.rules.yml

evaluation_interval: 30s

tests:
  - name: steady 2 percent errors burns at about 20x and pages
    interval: 1m
    input_series:
      - series: 'trace_lab_http_requests_total{method="GET",route="/orders/{order_id}",status="2xx"}'
        values: "0+98x120"
      - series: 'trace_lab_http_requests_total{method="GET",route="/orders/{order_id}",status="5xx"}'
        values: "0+2x120"
    alert_rule_test:
      - eval_time: 10m
        alertname: TraceLabAvailabilityBurnFast
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "availability budget burning at 14.4x or more"
              description: "5xx responses are over 14.4x the budget over both 1h and 5m."
      - eval_time: 20m
        alertname: TraceLabAvailabilityBurnSlow
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "availability budget burning at 6x or more"
              description: "5xx responses are over 6x the budget over both 6h and 30m."
    promql_expr_test:
      - expr: trace_lab:http_error_ratio:rate5m
        eval_time: 10m
        exp_samples:
          - labels: "trace_lab:http_error_ratio:rate5m"
            value: 0.02

  - name: 0.1 percent errors is exactly on budget, so no page
    interval: 1m
    input_series:
      - series: 'trace_lab_http_requests_total{method="GET",route="/orders/{order_id}",status="2xx"}'
        values: "0+999x240"
      - series: 'trace_lab_http_requests_total{method="GET",route="/orders/{order_id}",status="5xx"}'
        values: "0+1x240"
    alert_rule_test:
      - eval_time: 3h
        alertname: TraceLabAvailabilityBurnFast
        exp_alerts: []
      - eval_time: 3h
        alertname: TraceLabAvailabilityBurnSlow
        exp_alerts: []

  - name: the short window clears the page after errors stop while the long one is still high
    interval: 1m
    input_series:
      # 3 percent errors for the first 60 minutes, then none.
      - series: 'trace_lab_http_requests_total{method="GET",route="/orders/{order_id}",status="2xx"}'
        values: "0+97x60 5820+100x60"
      - series: 'trace_lab_http_requests_total{method="GET",route="/orders/{order_id}",status="5xx"}'
        values: "0+3x60 180+0x60"
    alert_rule_test:
      - eval_time: 55m
        alertname: TraceLabAvailabilityBurnFast
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "availability budget burning at 14.4x or more"
              description: "5xx responses are over 14.4x the budget over both 1h and 5m."
      - eval_time: 70m
        alertname: TraceLabAvailabilityBurnFast
        exp_alerts: []
    promql_expr_test:
      - expr: trace_lab:http_error_ratio:rate1h > bool (14.4 * 0.001)
        eval_time: 70m
        exp_samples:
          - labels: "{}"
            value: 1

  - name: 20 percent of requests over 300 ms pages on latency
    interval: 1m
    input_series:
      - series: 'trace_lab_http_request_duration_seconds_bucket{method="GET",route="/slow",le="0.3"}'
        values: "0+80x120"
      - series: 'trace_lab_http_request_duration_seconds_count{method="GET",route="/slow"}'
        values: "0+100x120"
    alert_rule_test:
      - eval_time: 10m
        alertname: TraceLabLatencyBurnFast
        exp_alerts:
          - exp_labels:
              severity: page
              slo: latency
            exp_annotations:
              summary: "latency budget burning at 14.4x or more"
              description: "Responses slower than 0.3 s are over 14.4x the budget over both 1h and 5m."
